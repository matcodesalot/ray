<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ray</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      /* The canvas is the whole window; the 320x200 image is letterboxed inside it
         by main.ts, so the black you see around the image is bare canvas. */
      #screen {
        display: block;
        width: 100%;
        height: 100%;
        /* Belt and braces: the upscale itself disables smoothing in the 2D context,
           but these keep the browser from resampling the canvas element. */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* Debug text lives in the DOM, not in the software framebuffer. Keeping it out
         means the 320x200 image stays pure render output, and this stays crisp. */
      #overlay {
        position: fixed;
        top: 8px;
        left: 10px;
        margin: 0;
        color: #7fff7f;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <pre id="overlay"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
